[project]
name = "coursetrack"
version = "0.1.0"
description = "Canvas deadline tracker with Google Calendar mirroring and email reminders"
requires-python = ">=3.11"

# Kept deliberately tiny: this is everything the scheduled job installs.
# smtplib, tomllib, zoneinfo, json, base64 and email.message are all stdlib.
dependencies = [
    "httpx>=0.27",
    "cryptography>=42",
]

[project.optional-dependencies]
# Only installed locally. GitHub Actions never pulls these.
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
]

[project.scripts]
coursetrack = "coursetrack.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
